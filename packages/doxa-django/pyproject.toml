[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doxa-django"
version = "1.3.0"
description = "Official Django and Python SDK for Doxa Central IAM (OAuth 2.0 / OIDC)"
readme = "README.md"
authors = [{ name = "Doxa IAM Team" }]
license = { text = "MIT" }
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
requires-python = ">=3.10"
dependencies = [
    "django>=4.2",
    "pyjwt[crypto]>=2.8.0",
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/haradejene/user-management-system"
